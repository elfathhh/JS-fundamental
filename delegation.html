<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .questions{
            max-width: 1120px;
        }

        .item{
            width: 100%;
            display: grid;
            text-align: center;
            gap: 14px;
        }

        .item .answer{
            margin-bottom: 8px;
        }

        .top{
            margin-bottom: 12px;
            cursor: pointer;
        }

        .icon{
            transition: transform 0.3s ease ;
        }

        .answer{
            display: none;
        }
    </style>
</head>
<body>
    <div class="questions">
    <div class="item">
        <button class="top">
            Impian?
            <span class="icon">▲</span>
        </button>
        <div class="answer">Menjadi berguna</div>
    </div>

    <div class="item">
        <button class="top">
            Kenapa?
            <span class="icon">▲</span>
        </button>
        <div class="answer">Karena hidup perlu arah</div>
    </div>

    <div class="item">
        <button class="top">
            Halangan?
            <span class="icon">▲</span>
        </button>
        <div class="answer">Rasa nyaman</div>
    </div>
</div>


<script>
    const container = document.querySelector(".questions");

    container.addEventListener("click", (e) => {
        const btn = e.target.closest(".top");
        if (!btn) return;

    const answer = btn.nextElementSibling;
    const icon = btn.querySelector(".icon");

    answer.style.display =
        answer.style.display === "block" ? "none" : "block";
    icon.style.transform = 
        icon.style.transform === "rotate(180deg)" ? "rotate(0deg)" : "rotate(180deg)";
});

</script>

</body>
</html>
