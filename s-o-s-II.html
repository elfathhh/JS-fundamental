<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div class="kotak"></div>



<script>
    data = [
        {tema : "olahraga", GorB:"is good"},
        {tema: "politik", GorB:"is depends"},
        {tema:"teknologi", GorB:"is good"},
    ];

    const container = document.querySelector(".kotak");
    let selected = null;

    function render() {
        container.innerHTML = "";

        data.forEach((item, index) => {
            const div = document.createElement("div");
            div.className = "item";

            const isActive = index === selected;

            div.innerHTML= `
                <button class="top" data-index="${index}">${item.tema}</button>
                <div class="answer"> 
                ${isActive ? `<div class="answer">${item.GorB}</div>` : ""}
            `
            container.appendChild(div);
        });
    };

    render();

    container.addEventListener("click", (e) =>  {
        const btn = e.target.closest(".top");
        if(!btn) return;

        const index = Number(btn.dataset.index);

        selected = selected === index ? null : index;
        render();
    });
</script>
</body>
</html>
