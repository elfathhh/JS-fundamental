    // ini versi benar 👇
    
    const container = document.getElementById("post");
    
    let state = {
        likes : 0,
        liked : false
    };

    function render() {
        container.innerHTML=`
            <button class="${state.liked ? "active" : ""}" id="likeBtn">
                ${state.liked ? "unlike":"like"}
            </button>
            <div>${state.likes} likes</div>
        `;
    }

    render();

    document.addEventListener("click", (e) => {
        if (e.target.id !== "likeBtn") return; 
        // ubah state-nya ja
        if (state.liked){
            state.liked = false;
            state.likes--;
        } else{
            state.liked = true;
            state.likes++;
        }

        render();
    });
</script>
